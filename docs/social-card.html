<!doctype html>
<!-- The link-preview image, site/images/social.png (1200 x 630), is this page. To make it again, from
     the repository's root:
       "<path to Chrome>" --headless=new --hide-scrollbars --window-size=1200,630 \
         --screenshot=site/images/social.png docs/social-card.html -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>When can I stop? Link-preview card</title>
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 500px 1fr;
        gap: 40px;
        align-items: center;
        padding: 0 0 0 64px;
        background: #eef1f3;
        color: #17212b;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 64px;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      .what {
        margin: 14px 0 30px;
        font-size: 28px;
        color: #5c6a77;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 23px;
        line-height: 1.35;
      }
      li {
        margin: 0 0 14px;
        padding-left: 26px;
        position: relative;
      }
      li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 11px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #2d7a4c;
      }
      .site {
        margin-top: 30px;
        font-size: 26px;
        font-weight: 700;
        color: #1f5f9e;
      }
      .shot {
        height: 530px;
        border-radius: 14px 0 0 14px;
        overflow: hidden;
        box-shadow:
          0 2px 6px rgb(23 33 43 / 10%),
          0 18px 48px rgb(23 33 43 / 16%);
      }
      .shot img {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>When can I stop?</h1>
      <p class="what">A Monte Carlo FIRE simulator</p>
      <ul>
        <li>How often your money lasts, across 10,000 futures</li>
        <li>Pensions, retirement accounts, spending rules</li>
        <li>Runs in your browser: nothing leaves your device</li>
      </ul>
      <p class="site">whencanistop.fyi</p>
    </div>
    <div class="shot"><img src="screenshot.png" alt="" /></div>
  </body>
</html>
